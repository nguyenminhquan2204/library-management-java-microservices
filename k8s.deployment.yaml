# Discoveryserver Deployement
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discoveryserver
spec:
  replicas: 3
  selector:
    matchLabels:
      app: discoveryserver
  template:
    metadata:
      labels:
        app: discoveryserver
    spec:
      containers:
        - name: discoveryserver
          image: microservice-eventsourcing-discoveryserver
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761

# Discoveryserver Service
apiVersion: v1
kind: Service
metadata:
  name: discoveryserver
spec:
  selector:
    app: discoveryserver
  type: NodePort
  ports:
    - protocol: TCP
      targerPort: 8761
      port: 8761

# Apigateway Deployment
apiVersion: app/v1
kind: Deployment
metadata:
  name: apigateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: microservice-eventsourcing-apigateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

# Apigateway Service
apiVersion: v1
kind: Service
metadate:
  name: apigateway
spec:
  selector:
    app: apigateway
  type: NodePort
  ports:
    - protocol: TCP
      port: 8080
      targetPorst: 8080
