name: CI/CD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-pust:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: action/checkout@v4

      # Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      # Set environment variables
      - name: Set environment variables
        run: echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV
        
      # Build and Push Images Using Docker Compose
      - name: Build and Push Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        runs: |
          docker compose -f docker-compose.yml build discoverserver
          docker compose -f docker-compose.yml push discoverserver

  deployment:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
        # Checkout repository
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: SSH to server
          uses: appleboy/ssh-action@v1.2.0
          env:
              DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SERVER_KEY }}
              port: ${{ secrets.SERVER_PORT }}
              envs: DOCKER_USERNAME
              script_path: scripts/deploy.sh
              